# Publishes the site. Runs every hour, but only rebuilds when something in
# Notion has changed. Press "Run workflow" on the Actions tab to publish now.
name: Publish

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild even if Notion has not changed'
        type: boolean
        default: true
  push:
    branches: [main]
    paths-ignore: ['data/cache/**', 'README.md']

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_DATABASE_ID: ${{ vars.NOTION_DATABASE_ID || '95ffbb34b7d141678961ec3c9ba9b615' }}
      GOOGLE_PLACES_KEY: ${{ secrets.GOOGLE_PLACES_KEY }}
      PUBLIC_GOOGLE_MAPS_KEY: ${{ secrets.PUBLIC_GOOGLE_MAPS_KEY }}
      PUBLIC_GOOGLE_MAP_ID: ${{ vars.PUBLIC_GOOGLE_MAP_ID || 'DEMO_MAP_ID' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TRANSLATE_MODEL: ${{ vars.TRANSLATE_MODEL || 'claude-sonnet-5-5' }}
      SITE_URL: ${{ vars.SITE_URL || 'https://namaragood.pages.dev' }}
      INCLUDE_DRAFTS: ${{ vars.INCLUDE_DRAFTS || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci

      - name: Keys set up yet?
        id: ready
        run: |
          missing=""
          for k in NOTION_TOKEN CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do [ -z "${!k}" ] && missing="$missing $k"; done
          if [ -n "$missing" ]; then echo "::notice::Not publishing yet. Missing secrets:$missing (see README, step 5)"; echo "go=false" >> "$GITHUB_OUTPUT"; else echo "go=true" >> "$GITHUB_OUTPUT"; fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Anything new in Notion?
        id: check
        if: steps.ready.outputs.go == 'true' && github.event_name == 'schedule'
        run: node scripts/check-changes.mjs

      - name: Read Notion, find places, translate
        if: steps.ready.outputs.go == 'true' && (github.event_name != 'schedule' || steps.check.outputs.changed == 'true')
        run: npm run data

      - name: Build
        if: steps.ready.outputs.go == 'true' && (github.event_name != 'schedule' || steps.check.outputs.changed == 'true')
        run: npm run build

      - name: Deploy to Cloudflare Pages
        if: steps.ready.outputs.go == 'true' && (github.event_name != 'schedule' || steps.check.outputs.changed == 'true')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Creates the Pages project the first time; harmless afterwards.
          npx --yes wrangler@4 pages project create namaragood --production-branch=main 2>/dev/null || true
          npx --yes wrangler@4 pages deploy dist --project-name=namaragood --branch=main --commit-dirty=true

      - name: Save caches (translations, map lookups, entry numbers)
        if: steps.ready.outputs.go == 'true' && (github.event_name != 'schedule' || steps.check.outputs.changed == 'true')
        run: |
          node scripts/check-changes.mjs --save || true
          git config user.name "namara-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/cache
          git diff --cached --quiet || git commit -m "Update caches [skip ci]"
          git push
